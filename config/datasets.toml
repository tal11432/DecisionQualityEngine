# Dataset, pitch and processing configuration. Edit values here, not in code.

[pitch]
# Metrica documents 105 x 68 m for its sample games. Other providers MUST set their own values.
length_m = 105.0
width_m = 68.0
goal_width_m = 7.32

[metrica]
# Pinned upstream commit for reproducibility (https://github.com/metrica-sports/sample-data).
commit = "e706dd506b360d69d9d123d5b8026e7294b13996"
base_url = "https://raw.githubusercontent.com/metrica-sports/sample-data/{commit}/data/{game}/{file}"
local_dir = "data/metrica"
# Metrica CSV frame rate (25 Hz); used only as the expected value in validation.
expected_fps = 25.0

[metrica.games.1]
name = "Sample_Game_1"
files = [
  "Sample_Game_1_RawTrackingData_Home_Team.csv",
  "Sample_Game_1_RawTrackingData_Away_Team.csv",
  "Sample_Game_1_RawEventsData.csv",
]

[metrica.games.2]
name = "Sample_Game_2"
files = [
  "Sample_Game_2_RawTrackingData_Home_Team.csv",
  "Sample_Game_2_RawTrackingData_Away_Team.csv",
  "Sample_Game_2_RawEventsData.csv",
]

[metrica.games.3]
# EPTS/FIFA format: files = tracking .txt, metadata .xml, events .json (order matters for src/ingestion/epts.py)
name = "Sample_Game_3"
format = "epts"
files = [
  "Sample_Game_3_tracking.txt",
  "Sample_Game_3_metadata.xml",
  "Sample_Game_3_events.json",
]

[sync]
# Max |event time - frame time| in seconds. Half a frame (0.02 s @ 25 Hz) = nearest frame.
tolerance_s = 0.02

[validation]
coord_margin_m = 3.0        # points further than this outside the pitch are flagged
max_player_speed_ms = 12.0  # implausible frame-to-frame player speed
max_ball_speed_ms = 45.0    # implausible frame-to-frame ball speed
dt_tolerance_s = 0.001      # allowed deviation of frame spacing from the median

[decision_time]
# Strict decision-time contract (see reports/pass_feasibility_leakage_audit.md).
# Decision frame = the event's release frame (ball at the passer's feet; verified on Game 1)
# plus offset_frames (<= 0 moves the decision earlier). Model inputs use frames <= decision frame ONLY.
offset_frames = 0
velocity_window_frames = 5       # causal backward-difference window (0.2 s @ 25 Hz); fixed a priori
possession_max_ball_dist_m = 3.0 # ball must be this close to the passer at the decision frame
min_pass_length_m = 3.0
# Label-side target identification (NOT a model input): which teammate was the pass aimed at, from the
# ball's heading over the first N frames after release. Values chosen on Game 1 completed passes only,
# where the true receiver is known (84.8% correct when assigned, 59.7% assigned).
heading_window_frames = 6
heading_min_displacement_m = 1.0
heading_max_deviation_deg = 15.0
heading_min_gap_deg = 5.0        # best candidate must beat the runner-up by this margin, else ambiguous

[feasibility]
# Kinematic parameters. ball_speed is a MEASURED population prior (median average speed of completed
# ground passes in Game 1; a fixed constant, not a per-pass value). player_speed and reaction_time are
# ASSUMED (originals); the leakage-safe Game 1 grid in reports/pass_feasibility_results.txt is
# diagnostic, not adopted: it is weakly identified and not an independent physical measurement.
ball_speed_ms = 11.9
player_speed_ms = 7.0
reaction_time_s = 0.3
lane_samples = 60
